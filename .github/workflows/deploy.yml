# Сборка панели и публикация на GitHub Pages.
#
# После этого приложение перестаёт зависеть от запущенного на компьютере
# dev-сервера: в манифесте Miro адрес localhost меняется на постоянный.
name: Publish panel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикация всегда одна: незавершённые запуски отменяем, чтобы более старая
# сборка не перезаписала более новую.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Сайт лежит в подпапке с именем репозитория, а не в корне домена.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
