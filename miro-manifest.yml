# Настройки приложения Miro.
#
# Их не нужно никуда деплоить: содержимое этого файла вставляется в
# developers.miro.com → ваше приложение → App settings → вкладка с манифестом.
# Файл лежит в репозитории, чтобы настройки приложения были под контролем
# версий вместе с кодом, а не только в веб-интерфейсе Miro.
#
# Для продакшена меняются две вещи: sdkUri на адрес задеплоенного приложения
# и allowedDomains на его домен.

appName: Конструктор уроков
sdkVersion: SDK_V2
sdkUri: http://localhost:3000/

scopes:
  # Читаем доску, чтобы находить свободное место и проверять задания.
  - boards:read
  # Создаём объекты урока.
  - boards:write

boardPicker:
  allowedDomains:
    - localhost
